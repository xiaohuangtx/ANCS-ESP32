name: Build Firmware

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read Project Version
        shell: bash
        run: |
          version=$(sed -nE 's/^set\(PROJECT_VER[[:space:]]+"([^"]+)"\)$/\1/p' CMakeLists.txt | head -n1)

          if [[ -z "$version" ]]; then
            echo "Failed to read PROJECT_VER from CMakeLists.txt" >&2
            exit 1
          fi

          echo "PROJECT_VERSION=$version" >> "$GITHUB_ENV"
          echo "PROJECT_BINARY=build/merged-binary-v$version.bin" >> "$GITHUB_ENV"
          echo "OTA_BINARY=build/ota-binary-v$version.bin" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build
          idf.py merge-bin
          mv build/merged-binary.bin "$PROJECT_BINARY"
          cp build/ancs-esp32.bin "$OTA_BINARY"

      - name: Upload Artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          retention-days: 3
          path: |
            ${{ env.PROJECT_BINARY }}
            ${{ env.OTA_BINARY }}
          if-no-files-found: error

      - name: Setup Node
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Changelog Dependencies
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          npm install --no-save conventional-changelog-cli conventional-changelog-conventionalcommits
        
      - name: Generate Changelog
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        id: changelog
        run: |
          echo "Generating changelog..."
          git config --global --add safe.directory '*'
          npx conventional-changelog -p conventionalcommits -i build/CHANGELOG_TEMP.md -s -r 2

      - name: Change Changelog
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          tail -n +2 build/CHANGELOG_TEMP.md > build/CHANGELOG.md

      - name: Attach to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          body_path: build/CHANGELOG.md
          files: |
            ${{ env.PROJECT_BINARY }}
            ${{ env.OTA_BINARY }}
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clear compiled files
        if: ${{ always() }}
        run: |
          rm -rf ./build
